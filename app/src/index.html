<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claude Sessions</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar" data-tauri-drag-region>
    <input id="q" type="search" placeholder="Search" autocomplete="off" spellcheck="false" />
    <button id="settings" class="icon-btn" title="Settings (⌘,)" aria-label="Settings">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.6" /><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4" /></svg>
    </button>
  </header>
  <main>
    <ul id="list"></ul>
    <p id="empty" hidden></p>
  </main>
  <div id="toast" role="status" hidden></div>
  <script src="theme.js"></script>
  <script src="main.js"></script>
</body>
</html>
